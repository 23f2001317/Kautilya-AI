version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:16-pg16
    container_name: kautilya-postgres
    restart: always
    environment:
      POSTGRES_USER: kautilya_user
      POSTGRES_PASSWORD: kautilya_password
      POSTGRES_DB: kautilya_db
    ports:
      - "5432:5432"
    volumes:
      - ../../.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kautilya_user -d kautilya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: kautilya-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/kautilya_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ../../.docker-data/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kautilya-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ../../.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kautilya-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../../.docker-data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
